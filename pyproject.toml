[tool.uv]
python = "3.13"

[project]
name = "jusbrasil-clone"
version = "0.1.0"
description = "Plataforma de consulta processual brasileira"
requires-python = ">=3.13"
dependencies = [
    "Flask>=3.1.1",
    "gunicorn>=23.0.0",
    "requests>=2.32.4",
    "qrcode[pil]>=8.2",
    "pytz>=2025.2",
    "email-validator>=2.2.0",
    "psycopg2-binary>=2.9.10",
    "flask-sqlalchemy>=3.1.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"